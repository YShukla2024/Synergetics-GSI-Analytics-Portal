name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install and Build
        run: |
          npm ci
          npm run build

      - name: Create deployment zip (no node_modules)
        run: |
          zip -r deploy.zip . -x "node_modules/*" -x ".git/*" -x ".next/cache/*"

      - name: Deploy to Azure
        uses: Azure/webapps-deploy@v3
        with:
          app-name: 'Synergetics-Microsoft-Analytics-Portal'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0095E1FC38B846EC8D21FE54A819E02F }}
          package: deploy.zip
          restart: true
