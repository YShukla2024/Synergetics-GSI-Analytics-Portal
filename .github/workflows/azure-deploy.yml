name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install and Build
        run: |
          npm ci
          npm run build

      - name: Prepare deployment package
        run: |
          # Copy standalone output to root
          cp -r .next/standalone/* .
          # Copy static assets
          cp -r .next/static .next/standalone/.next/static 2>/dev/null || cp -r .next/static .next/static
          # Copy public folder
          cp -r public .next/standalone/public 2>/dev/null || true

      - name: Deploy to Azure
        uses: Azure/webapps-deploy@v3
        with:
          app-name: 'Synergetics-Microsoft-Analytics-Portal'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0095E1FC38B846EC8D21FE54A819E02F }}
          package: .
          restart: true
