name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install and Build
        run: |
          npm ci
          npm run build

      - name: Create deployment package
        run: |
          mkdir deploy
          cp -r .next/standalone/* deploy/
          mkdir -p deploy/.next/static
          cp -r .next/static/* deploy/.next/static/
          cp -r public deploy/public 2>/dev/null || true
          cp server.js deploy/server.js 2>/dev/null || true
          cp web.config deploy/web.config 2>/dev/null || true
          cd deploy && tar -czf ../deploy.tar.gz .
          echo "Package size: $(du -sh ../deploy.tar.gz | cut -f1)"

      - name: Deploy to Azure
        uses: Azure/webapps-deploy@v3
        with:
          app-name: 'Synergetics-Microsoft-Analytics-Portal'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0095E1FC38B846EC8D21FE54A819E02F }}
          package: deploy
          restart: true
